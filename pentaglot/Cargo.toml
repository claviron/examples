[package]
name = "pentaglot"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
claviron = { version = "0.2.3", default-features = false, features = ["edge", "axum", "websocket", "logging", "module"] }
claviron-asgi = { version = "0.2.3", features = ["edge"] }
claviron-deno = { version = "0.2.2", default-features = false, features = ["edge", "fetch", "websocket"] }
claviron-lua = { version = "0.2.2", features = ["edge", "orbit", "websocket"] }
claviron-php = { version = "0.2.3", features = ["embed", "edge"] }
clap = { version = "4", features = ["derive"] }
http-body-util = "0.1"
mimalloc = "0.1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.dev]
opt-level = 1
debug = 1
incremental = true
codegen-units = 256

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
panic = "unwind"
