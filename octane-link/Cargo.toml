[package]
name = "octane-link"
repository = "https://github.com/claviron/octane-link.git"
version = "0.1.0"
edition = "2024"
publish = false
description = "Laravel application hosted by Lumenize behind a separate Claviron edge."

[workspace]

[features]
# LEGACY_LINUX: build for Linux kernels older than 5.3 (AlmaLinux 8's 4.18),
# which have no pidfd for watching worker processes:
#   ./scripts/octane-link.sh --legacy-linux
legacy-linux = ["lumenize/legacy-linux"]

[dependencies]
lumenize = { version = "=0.2.0-alpha.26", default-features = false, features = ["runner", "cli", "broadcast", "log", "files", "sqlite"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
mimalloc = "0.1"
