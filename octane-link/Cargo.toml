[package]
name = "octane-link"
repository = "https://github.com/claviron/octane-link.git"
version = "0.1.0"
edition = "2024"
publish = false
description = "Laravel application hosted by Lumenize behind a separate Claviron edge."

[workspace]

[features]
# LEGACY_LINUX: build for Linux kernels older than 5.3 (AlmaLinux 8's 4.18),
# which have no pidfd for watching worker processes:
#   scripts/build.sh --features legacy-linux
legacy-linux = ["lumenize/legacy-linux"]

[dependencies]
lumenize = { version = "0.2.5", default-features = false, features = ["runner", "cli", "broadcast", "log", "files", "sqlite", "redis", "tls"] }
# Makes the certificates the launch's `tls` section names, as the Edge example does.
demo-certs = { path = "../demo-certs" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
mimalloc = "0.1"

[dev-dependencies]
# `cargo bench`: what one claim costs through each language, measured against
# the running application.
criterion = { version = "0.5", default-features = false, features = ["async_tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["http2"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# `cargo run --release --example orchestra`: Rust and PHP workers claiming
# from the shared atomic in bursts, drawn in the terminal.
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[[bench]]
name = "claims"
harness = false

[[example]]
name = "orchestra"
