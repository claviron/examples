# HTTP and Pusher WebSockets both arrive over Orbit. Start from this root.
name: octane-link
fleet_name: octane
icon: laravel
request_mode: application
try_files: true
assets: [ build, images ]
orbit:
  link:
    # PHP instances supply eight running places. Link holds 184 waiting.
    max_queued: 184
    # This application owns its fleet and declares its shape; every caller
    # adopts it. The inbox holds control frames beside admitted work.
    geometry:
      fleet_capacity: 32
      inbox_capacity: 256
      inbox_payload_capacity: 17408
      lane_capacity: 128
      buffer_bytes: 65536
# Where each door runs, from .env.
defaults:
  listener:
    execution: "${LISTENER_EXECUTION}"
# Doors of the application's own, for trying it without the Edge. Where TLS
# offers HTTP/2 and HTTP/1.1 through ALPN, the order is the server's
# preference: h2 first, or a client offering both gets HTTP/1.1.
listeners:
  # Plain HTTP/1.
  application-tcp:
    transport: tcp
    listen: 127.0.0.1:8102
    protocols: [h1]
  # HTTPS with the store's default identity; asks for no client certificate.
  application-tls:
    transport: tcp
    listen: 127.0.0.1:8103
    protocols: [h2, h1]
    tls: on
  # The same HTTPS, requiring a client certificate the store's demo
  # authority signed: the declaration an Edge host makes in its tls block.
  application-mtls:
    transport: tcp
    listen: 127.0.0.1:8104
    protocols: [h2, h1]
    tls:
      client_auth:
        authority:
          local: demo
# The certificate store, in the schema of Claviron's tls.yaml. The TLS door
# serves the default identity. What is missing is made at boot, before TLS
# reads it: the CA, unless one is already here, then each named certificate
# (demo-certs). `.ssl` is relative to the working directory and is never
# committed; put an authority you already trust at .ssl/ca/demo to use it.
tls:
  certstore:
    dir: .ssl
    authority:
      local: demo
    organization:
      name: Octane Link Demo
      email: demo@example.test
  default:
    path: servers/octane.test/fullchain.pem
  certs:
    - octane.test
# Redis connections, for the cache stores below that name one. Only the URL
# is required.
redis:
  connections:
    default:
      url: ${REDIS_URL}
cache:
  default: fleet
  stores:
    fleet:
      driver: orbit
    # One shared table: a worker that restarts reads the sessions the others
    # wrote, which a worker-local copy would not hold.
    sessions:
      driver: orbit
      mode: shm
    # Redis, through the connection the redis section declares.
    redis:
      driver: redis
      connection: default
      prefix: "octane:"
database:
  sqlite:
    octane:
      path: ${DB_DATABASE}
      busy_timeout: 100ms
      pool:
        pool_size: 1
        idle_size: 0
        acquire_timeout: 30s
        idle_timeout: 10m
        max_lifetime: 30m
# The application owns its SQLite sample at database/demo.sqlite.
requests:
  max_body_size: 64 MiB
  body_read_timeout: 30s
responses:
  idle_timeout: 60s
broadcasting:
  key: ${PUSHER_APP_KEY}
  secret: ${PUSHER_APP_SECRET}
  client_events: true
logging:
  system_log:
    path: storage/logs/octane-link.log
    format: line
    truncate: true
  channels:
    laravel:
      adapter: file
      path: storage/logs/lumenize.log
      format: line
      truncate: true
php:
  events:
    capacity: 128
  engine:
    # This application's own php.ini, and no scan directory: PHP reads no
    # other ini file, whatever the installation or the environment names.
    ini_path: php.ini
    ini_scan_dir: ""
    # Compiled views are not warmed: Blade rewrites an outdated one on its
    # first render, after the warmup has already cached the old file.
    warmup: [app, bootstrap, config, routes, vendor/laravel/framework/src, vendor/symfony]
  lifecycle:
    graceful_timeout: 60s
    execution_timeout: 30s
  sapi: null
  application:
    script_path: application.php
    env_file: .env
    env:
      APP_ENV: production
      APP_DEBUG: "false"
      OCTANE_SERVER: claviron
      CACHE_STORE: claviron
      SESSION_DRIVER: claviron
      SESSION_STORE: claviron_sessions
      SESSION_BLOCK: "false"
      BROADCAST_CONNECTION: claviron
      LOG_CHANNEL: claviron
    instances: 8
    retry:
      max_attempts: null
      backoff: 1s
      backoff_max: 10s
