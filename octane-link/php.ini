; The whole PHP configuration of this example. lumenize.yaml names this file
; as `php.engine.ini_path` and declares no scan directory, so PHP reads no
; other ini file and loads no extension this file does not name. Everything
; not set here is PHP's built-in default.

; Kept from the installation's php.ini. PHP's default would let dl() load an
; extension at run time; Off keeps this file the only place they come from.
enable_dl=Off

; Kept from the embed scan directory of the PHP installation this example ran
; with before. Nothing here needs it: that phpredis build has no igbinary
; serializer, and the application does not call igbinary itself.
extension=igbinary
; Laravel's own Redis client is phpredis (config/database.php, REDIS_CLIENT).
; The cache stores in lumenize.yaml reach Redis through Claviron instead.
extension=redis

[opcache]
; Development: a changed file is compiled again the next time it is included.
; Every request of a persistent application runs inside the one PHP request
; its worker started with, and OPcache reads the clock it measures
; revalidate_freq against only when a PHP request starts. Any value above 0
; therefore lets a worker check a file at most once in its life; 0 checks the
; timestamp on every include, without reading that clock.
opcache.validate_timestamps=1
opcache.revalidate_freq=0
