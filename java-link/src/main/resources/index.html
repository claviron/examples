<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Java Link</title>
<style>
  :root { font-family: system-ui, sans-serif; color: #202a39; background: #f6f4ee; }
  body { max-width: 680px; margin: 12vh auto; padding: 0 24px; }
  small { color: #65705f; letter-spacing: .12em; text-transform: uppercase; }
  h1 { font-size: clamp(3rem, 10vw, 5rem); margin: 16px 0; letter-spacing: -.06em; }
  p { line-height: 1.6; }
  section { margin-top: 32px; padding: 24px; border: 1px solid #d7d9cc; border-radius: 16px; background: white; }
  h2 { font-size: 1.1rem; margin-top: 0; }
  button, textarea { font: inherit; border: 1px solid #bdc5b2; border-radius: 8px; padding: 10px 14px; }
  button { background: #264d3c; color: white; cursor: pointer; }
  textarea { box-sizing: border-box; display: block; width: 100%; margin-bottom: 12px; resize: vertical; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.5; }
</style>
<body>
  <small>Claviron · Orbit · Java</small>
  <h1>Java Link.</h1>
  <p>A plain Java application. Boot once, then handle HTTP requests over Orbit.</p>
  <section>
    <h2>Application</h2>
    <pre id="status">Connecting…</pre>
    <button id="refresh" type="button">Refresh status</button>
  </section>
  <section>
    <h2>Streaming echo</h2>
    <form id="echo">
      <textarea id="message" rows="3" aria-label="Message">Hello from Java.</textarea>
      <button type="submit">Send to Java</button>
    </form>
    <pre id="reply" aria-live="polite"></pre>
  </section>
  <script>
    async function refresh() {
      const target = document.querySelector('#status');
      try {
        const response = await fetch('/api/status');
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        target.textContent = JSON.stringify(await response.json(), null, 2);
      } catch (error) { target.textContent = error.message; }
    }
    document.querySelector('#refresh').addEventListener('click', refresh);
    document.querySelector('#echo').addEventListener('submit', async event => {
      event.preventDefault();
      const target = document.querySelector('#reply');
      try {
        const response = await fetch('/api/echo', { method: 'POST', body: document.querySelector('#message').value });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        target.textContent = await response.text();
      } catch (error) { target.textContent = error.message; }
    });
    refresh();
  </script>
</body>
</html>
