[package]
name = "edge-server"
version = "0.1.0"
publish = false
edition = "2024"
description = "Example Claviron edge reaching applications over Orbit."

[workspace]

[dependencies]
claviron = { version = "0.2.2", features = ["config-watch", "edge", "tasks", "bench", "log-pipeline", "upstream", "tls", "websocket", "webtransport"] }
async-trait = "0.1"
clap = { version = "4.6", features = ["derive"] }
mimalloc = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"

# Keep the example application and edge on the same build profile.
[profile.dev]
codegen-units = 256
debug = 1
incremental = true
lto = false
opt-level = 1
panic = "abort"

[profile.release]
codegen-units = 1
debug = 0
incremental = false
lto = "thin"
opt-level = 3
panic = "unwind"
strip = true
