# The Axum process over a socket, beside its `orbit:` route above: an
# application reaches Edge either way. Profiles are in upstream.yaml.
axum-tcp.test:
  root: public
  transport:
    non_ssl: serve
    protocols: [h3, h2, h1]
    h1: { upgrade: true }
    h2: { connect_protocol: true }
  upstream: axum_tcp

