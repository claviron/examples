# Large uploads across an H1 upstream with explicit body limits.
upload.test:
  root: public
  transport:
    non_ssl: serve
    protocols: [h3, h2, h1]
    h1: { upgrade: true }
    h2: { connect_protocol: true }
  requests:
    max_body_size: 64 MiB
    body_read_timeout: 30s
  upstream: upload_sink
