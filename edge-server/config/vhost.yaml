# Independent application processes, reached by name over Orbit Link.
# These local demo hosts deliberately expose unauthenticated diagnostic routes.
js.test:
  root: ../js-link/public
  transport:
    non_ssl: serve
    protocols: [h3, h2, h1]
    h1: { upgrade: true }
    h2: { connect_protocol: true }
    h3: { wt: true }
  routes:
    /assets:
      static: {}
  orbit:
    - { application: js-link, fleet: orj }

octane.test:
  root: ../octane-link/public
  transport:
    non_ssl: serve
    protocols: [h3, h2, h1]
    h1: { upgrade: true }
    h2: { connect_protocol: true }
    h3: { wt: true }
  routes:
    /build:
      static: {}
  orbit:
    - { application: octane-link, fleet: octane }

symfony.test:
  root: ../symfony-link/public
  transport:
    non_ssl: serve
    protocols: [h3, h2, h1]
    h1: { upgrade: true }
    h2: { connect_protocol: true }
    h3: { wt: true }
  requests: { queue_timeout: 100ms }
  routes:
    /build:
      static: {}
  orbit:
    - { application: symfony-link, fleet: symfony, balance: first }

